<script>

  d.innerHTML=`<div class="ed-thumb">${p.src?`<img alt="" src="${escH(p.src)}">`:'<span>无图（使用默认画面）</span>'}</div>
  <div class="ed-pf"><input class="ed-cap" placeholder="这张照片的说明" value="${escH(p.caption||'')}">
  <div class="ed-prow"><label class="ed-file">选择图片<input type="file" accept="image/*"></label><button type="button" class="ed-btn ed-clr">清除图片</button><button type="button" class="ed-btn ed-rm">删除</button></div></div>`;
  d.querySelector('input[type=file]').onchange=async e=>{const f=e.target.files&&e.target.files[0];if(!f)return;try{const url=await resizeImage(f,PHOTO_MAX,0.78);d.dataset.src=url;d.querySelector('.ed-thumb').innerHTML=`<img alt="" src="${url}">`}catch(err){alert('这张图片无法读取，请换一张试试。')}};

  d.querySelector('.ed-rm').onclick=()=>d.remove();
  return d;
}

function readEditor(){
  const photos=[...$('ePhotos').querySelectorAll('.ed-photo')].slice(0,8).map(r=>({caption:r.querySelector('.ed-cap').value.trim(),src:r.dataset.src||''}));
  return Object.assign({},CONFIG,{

async function getSource(){
  try{if(/^https?:/.test(location.protocol)){const r=await fetch(location.pathname,{cache:'no-store'});if(r.ok){const t=await r.text();if(t.indexOf('CONFIG_START')>0)return t}}}catch(e){}
  return SRC_SNAPSHOT;
}
async function generate(){
  const btn=$('eGen');btn.disabled=true;const old=btn.textContent;btn.textContent='生成中…';
  try{
    const conf=readEditor();const src=await getSource();
    const json=JSON.stringify(conf,null,2).replace(/<\/(script)/gi,'<\\/$1').replace(/<!--/g,'<\\!--');
    const out=src.replace(/\/\* === CONFIG_START === \*\/[\s\S]*?\/\* === CONFIG_END === \*\//,()=>'/* === CONFIG_START === */\nconst CONFIG = '+json+';\n/* === CONFIG_END === */');
    const blob=new Blob([out],{type:'text/html;charset=utf-8'});const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download=FILE_PREFIX+'-'+(conf.name||'birthday').replace(/[\\/:*?"<>|\s]+/g,'_')+'.html';
    document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);
  }finally{btn.disabled=false;btn.textContent=old}
}
function bindEditor(){
  $('eAdd').onclick=()=>{if($('ePhotos').children.length>=8){alert('最多 8 张');return}$('ePhotos').appendChild(photoRow({caption:'',src:''}))};
  $('eGen').onclick=()=>{generate()};
  $('ePrev').onclick=()=>{Object.assign(CONFIG,readEditor());$('edit').classList.remove('on');document.body.classList.remove('editing');applyConfig();restart()};
  $('eClose').onclick=()=>{$('edit').classList.remove('on');document.body.classList.remove('editing');if(isEdit()){try{history.replaceState(null,'',location.pathname)}catch(e){}}};
  if(isEdit()){$('edit').classList.add('on');document.body.classList.add('editing');fillEditor()}
}

function piano(f,t,v,dur){
  const c=AU.ctx,o=bus(0.6),g=c.createGain();dur=dur||3.2;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+0.008);g.gain.exponentialRampToValueAtTime(v*0.3,t+0.35);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.setValueAtTime(Math.min(6000,f*7),t);lp.frequency.exponentialRampToValueAtTime(Math.max(380,f*1.6),t+dur*0.7);g.connect(lp);lp.connect(o);

}

  film.i++;const el=fr[film.i];
  const a=(Math.random()*4-2).toFixed(2),b=(Math.random()*4-2).toFixed(2),c2=(Math.random()*6-3).toFixed(2),d2=(Math.random()*6-3).toFixed(2);
  el.style.transition='none';el.style.transform=RM?'none':`scale(1.03) translate(${a}%,${b}%)`;void el.offsetWidth;
  el.style.transition=RM?'opacity 1s ease':'opacity 2s ease, transform 10s linear';el.style.transform=RM?'none':`scale(1.15) translate(${c2}%,${d2}%)`;
  [...fr].forEach((f,k)=>f.classList.toggle('on',k===film.i));
  $('fIdx').textContent=String(film.i+1).padStart(2,'0')+'　/　'+String(fr.length).padStart(2,'0');
  const cap=$('fCap');cap.style.opacity=0;clearTimeout(film.cap);film.cap=setTimeout(()=>{cap.textContent=ps[film.i].caption||'';cap.style.opacity=1},900);
  if(AU.ctx&&!AU.muted)piano(POOL[(film.i*2+3)%POOL.length],AU.ctx.currentTime+0.4,0.07);
  film.timer=setTimeout(nextFrame,RM?6000:7600);
}
$('s-film').addEventListener('click',()=>{if($('s-film').classList.contains('on'))nextFrame()});

/* ---------- 信 ---------- */
let letterT=[];
function startLetter(){
  clearTimeout(film.timer);show('s-letter');letterT.forEach(clearTimeout);letterT=[];
  $('lTo').textContent=CONFIG.greeting||('致 '+CONFIG.name);$('lName').textContent=CONFIG.signature||'';
  const d=new Date();$('lDate').textContent=d.getFullYear()+' · '+(d.getMonth()+1)+' · '+d.getDate();
  const box=$('lLines');box.innerHTML='';$('lSig').classList.remove('on');$('lEnd').classList.remove('on');$('s-letter').scrollTop=0;
  const lines=String(CONFIG.letter||'').split('\n');let k=0;
  lines.forEach(l=>{const el=document.createElement('div');el.className='ln'+(l.trim()?'':' sp');el.textContent=l;box.appendChild(el);
    const delay=RM?k*120:900+k*1500;if(l.trim())k++;else k+=0.35;letterT.push(setTimeout(()=>{el.classList.add('on');const s=$('s-letter');if(el.getBoundingClientRect().bottom>innerHeight-80)s.scrollTo({top:s.scrollTop+el.getBoundingClientRect().bottom-innerHeight+120,behavior:RM?'auto':'smooth'})},delay))});
  const end=RM?k*120+300:900+k*1500+800;
  letterT.push(setTimeout(()=>{$('lSig').classList.add('on');hbHint()},end));
  letterT.push(setTimeout(()=>{$('lEnd').classList.add('on');const s=$('s-letter');s.scrollTo({top:s.scrollHeight,behavior:RM?'auto':'smooth'})},end+2200));
}
$('replay').onclick=()=>restart();
let starN=0;$('star').onclick=()=>{starN++;if(AU.ctx&&!AU.muted)piano(1046.5,AU.ctx.currentTime,0.05,2);if(starN>=3){starN=0;$('eggText').textContent=CONFIG.egg||'';$('egg').classList.add('on')}};
$('egg').onclick=()=>$('egg').classList.remove('on');

/* ---------- 流程 ---------- */
function restart(){
  clearTimeout(film.timer);clearTimeout(F.autoT);letterT.forEach(clearTimeout);stopMic();
  document.querySelectorAll('#s-intro .fade-in').forEach(el=>{el.style.animation='none';void el.offsetWidth;el.style.animation=''});
  resetFlame();show('s-intro');
}
$('iGo').onclick=()=>{
  audioInit();startPad([NF.A3/2,NF.E3,NF.A3],0.07,480);pianoOn=true;pianoHold=Date.now()+2500;pianoLoop();
  resetFlame();sizeCv();show('s-candle');F.last=0;if(!F.raf)F.raf=requestAnimationFrame(candleLoop);
};
applyConfig();bindEditor();show('s-intro');
window.__bday={CONFIG,F,film,restart,startFilm,startLetter,extinguish,show,generate,readEditor,get audio(){return AU}};
})();
</script>
