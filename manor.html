<style>

<script>
(function(){
'use strict';
/* ================= 基础 ================= */
const W=1280,H=800,HOR=300,FOC=625,K=1000,AMB=0.965;
const SAVE_KEY='manor_greythorn_save_v1', SET_KEY='manor_greythorn_settings_v1';
const RM=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const $=id=>document.getElementById(id);
const cvs=$('c'), ctx=cvs.getContext('2d');
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const pick=a=>a[Math.floor(Math.random()*a.length)];
let seedV=1; const srand=s=>{seedV=(s*9301+49297)%233280||1}; const rnd=()=>{seedV=(seedV*16807)%2147483647;return (seedV-1)/2147483646};
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function lg(g,x0,y0,x1,y1,st){const q=g.createLinearGradient(x0,y0,x1,y1);st.forEach(s=>q.addColorStop(s[0],s[1]));return q}
function rg(g,x,y,r0,r1,st,x1,y1){const q=g.createRadialGradient(x,y,r0,x1==null?x:x1,y1==null?y:y1,r1);st.forEach(s=>q.addColorStop(s[0],s[1]));return q}
function poly(g,pts){g.beginPath();g.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)g.lineTo(pts[i][0],pts[i][1]);g.closePath()}
function P(u,h,d){return [640+FOC*u/d, HOR+FOC*(1.6-h)/d]}

/* ================= 设置 ================= */
let SET={mild:RM,captions:true,vol:0.8};
try{const s=JSON.parse(localStorage.getItem(SET_KEY)||'null');if(s)SET=Object.assign(SET,s)}catch(e){}
function saveSet(){try{localStorage.setItem(SET_KEY,JSON.stringify(SET))}catch(e){} if(AU.master)AU.master.gain.value=SET.vol}

/* ================= 状态 ================= */
function newState(){return{
  room:'hall',inv:[],taken:{},diary:[],battery:100,spare:0,sanity:100,light:true,hidden:null,
  flags:{entityOn:false,portraitsDone:false,photoDone:false,musicDone:false,dollScare:false,slatScare:false,mirror:false},
  visited:{},time:0,portraitSeq:[],photo:{order:[2,0,1],rot:[180,0,180]},
  E:{room:'basement',state:'roam',timer:12,x:900,target:null,enterT:0,catchT:0,searchT:0,searchTotal:8,near:0}
}}
let S=newState(), CP=null;
const G={mode:'title',paused:false,busy:false,lx:640,ly:420,tx:640,ty:420,R:180,I:1,fade:0,fadeDir:0,
  holding:false,breath:100,breathLock:false,det:0,hbT:0,ambT:14,idleStep:3,whT:20,fakeT:0,face:null,shake:0,
  saveT:0,dollArm:0,seeing:false,seenOnce:false,lastSafe:0,scale:1,ox:0,oy:0,tipId:null,
  scene:mk(W,H),sceneR:mk(W,H),sceneC:mk(W,H),mask:mk(W,H),dark:mk(W,H),touch:null};
G.sctx=G.scene.getContext('2d');G.mctx=G.mask.getContext('2d');G.dctx=G.dark.getContext('2d');

const ITEMS={
  key_nursery:{n:'育婴室钥匙',d:'一把小巧的黄铜钥匙，柄上刻着一只小羊。'},
  key_basement:{n:'地下室钥匙',d:'沉重的铁钥匙，锈迹斑斑，摸上去是湿的。'},
  key_front:{n:'大门钥匙',d:'庄园正门的钥匙。终于。'},
  photo1:{n:'照片碎片',d:'泛黄的相纸，边缘被撕得参差不齐。'},
  photo2:{n:'照片碎片',d:'泛黄的相纸，边缘被撕得参差不齐。'},
  photo3:{n:'照片碎片',d:'泛黄的相纸，边缘被撕得参差不齐。'},
  photo:{n:'修复的照片',d:'一张全家福。背面有字。'},
  note:{n:'书房便笺',d:'字迹潦草的便笺。'}
};
const has=id=>S.inv.includes(id);
const DIARY={
 d1:{t:'1876年3月2日',x:'今天双胞胎满七岁。老爷从伦敦带回一只银色的八音盒。\n克拉拉抱着不撒手，艾达在一旁看着，一句话也不说。\n两个孩子长得一模一样，只有我分得清——艾达左手腕上有一颗小痣。'},
 d2:{t:'1876年12月19日',x:'克拉拉发了高烧。\n昨夜育婴室的窗不知被谁打开了，雪落进来，盖住了她的被角。我明明记得睡前上了闩。\n艾达今早一直躲在衣柜里，问她什么也不肯出来。'},
 d3:{t:'1876年12月24日',x:'平安夜，克拉拉走了。老爷说是我失职。\n夫人整日坐在育婴室里上紧那只八音盒的发条，一遍又一遍。\n艾达终于开口了，她只说了一句：\n「我想让克拉拉看看雪。」'},
 d4:{t:'1877年1月',x:'老爷把艾达送去了北方的寄宿学校，不许任何人再提她的名字。\n他让画师把画像上她的脸刮掉。夫人从那以后就病了。\n我每晚还是去育婴室，替空床掖好被子——总得有人等那孩子回家。'},
 d5:{t:'（日期已无法辨认）',x:'老爷把我锁在这里，说我会「把那孩子的事说出去」。\n我听得见楼上的八音盒。\n如果有一天艾达回来了，请告诉她：那不是她的错。窗是我忘了闩的。\n我会一直等她，等到把她哄睡为止。\n                ——玛格丽特·格丽芙斯，保姆'}
};
const NOTE_TXT='（字迹潦草，墨水晕开）\n\n他们一个接一个离开了这座房子。\n按他们离世的先后，触碰他们的画框。\n那张被刮花的脸不在死者之列——她只是被送走了。\n最后，再碰她。\n\n                          ——E.A.';

/* ================= 音频（全部 WebAudio 合成） ================= */
const AU={ctx:null};
function audioInit(){
  if(AU.ctx){if(AU.ctx.state==='suspended')AU.ctx.resume();return}
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return;
  let c; try{c=new AC()}catch(e){return}
  AU.ctx=c;
  AU.master=c.createGain();AU.master.gain.value=SET.vol;AU.master.connect(c.destination);
  AU.comp=c.createDynamicsCompressor();AU.comp.threshold.value=-18;AU.comp.ratio.value=4;AU.comp.connect(AU.master);
  AU.verb=c.createConvolver();AU.verb.buffer=impulse(c,3.4,2.4);
  AU.verbOut=c.createGain();AU.verbOut.gain.value=0.55;AU.verb.connect(AU.verbOut);AU.verbOut.connect(AU.comp);
  AU.noise=noiseBuf(c,3);
  startAmbient();
}
function impulse(c,dur,decay){const len=Math.floor(c.sampleRate*dur),b=c.createBuffer(2,len,c.sampleRate);for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay)}return b}
function noiseBuf(c,dur){const len=Math.floor(c.sampleRate*dur),b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;return b}
function out(pan,wet,muffle){
  const c=AU.ctx,g=c.createGain();let n=g;
  if(muffle){const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=muffle;n.connect(lp);n=lp}
  if(c.createStereoPanner){const p=c.createStereoPanner();p.pan.value=clamp(pan||0,-1,1);n.connect(p);n=p}
  n.connect(AU.comp);
  const s=c.createGain();s.gain.value=wet==null?0.3:wet;n.connect(s);s.connect(AU.verb);
  return g;
}
function nsrc(t,dur){const s=AU.ctx.createBufferSource();s.buffer=AU.noise;s.start(t,Math.random()*2,dur);return s}
function step(pan,vol,heavy,delay,muffle){
  if(!AU.ctx)return;const c=AU.ctx,t=c.currentTime+(delay||0),o=out(pan,0.4,muffle);
  const s=nsrc(t,0.35),f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=heavy?360:750;
  const g=c.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol*0.9,t+0.008);g.gain.exponentialRampToValueAtTime(0.0008,t+(heavy?0.26:0.13));
  s.connect(f);f.connect(g);g.connect(o);
  const os=c.createOscillator();os.frequency.setValueAtTime(heavy?72:115,t);os.frequency.exponentialRampToValueAtTime(38,t+0.13);
  const g2=c.createGain();g2.gain.setValueAtTime(vol*(heavy?1.3:0.5),t);g2.gain.exponentialRampToValueAtTime(0.0008,t+0.17);
  os.connect(g2);g2.connect(o);os.start(t);os.stop(t+0.2);
  if(heavy&&Math.random()<0.35)creak(pan,vol*0.25,0.5,muffle,(delay||0)+0.05);
}
function steps(n,gap,pan,vol,heavy,muffle){for(let i=0;i<n;i++)step(pan,vol*(0.85+Math.random()*0.3),heavy,i*gap+Math.random()*0.05,muffle)}
function creak(pan,vol,dur,muffle,delay){
  if(!AU.ctx)return;const c=AU.ctx,t=c.currentTime+(delay||0);dur=dur||1.4;const o=out(pan,0.55,muffle);
  const os=c.createOscillator();os.type='sawtooth';const n=28,cv=new Float32Array(n);
  const base=90+Math.random()*80;for(let i=0;i<n;i++)cv[i]=base+Math.random()*60+Math.sin(i*0.6)*35;
  os.frequency.setValueCurveAtTime(cv,t,dur);
  const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=900+Math.random()*500;bp.Q.value=7;

  g.fillStyle='#010101';for(let x=0;x<W;x+=22){g.fillRect(x,640,5,160);g.beginPath();g.moveTo(x-3,642);g.lineTo(x+2.5,624);g.lineTo(x+8,642);g.fill()}g.fillRect(0,660,W,6);g.fillRect(0,740,W,6);
  return c})();
const FOG=Array.from({length:14},(_,i)=>({x:Math.random()*W,y:520+Math.random()*220,r:180+Math.random()*260,v:4+Math.random()*10}));
function drawTitle(g,t){
  g.drawImage(TITLE_BG,0,0);
  const nw=0.18+Math.max(0,Math.sin(t*0.5))*0.25+(Math.sin(t*13)>0.97?0.2:0);g.fillStyle=rg(g,1070,385,1,30,[[0,`rgba(255,190,110,${nw})`],[1,'rgba(255,160,80,0)']]);g.fillRect(1040,355,60,60);g.fillStyle=`rgba(255,200,130,${nw*0.9})`;g.fillRect(1062,372,16,26);
  if(Math.sin(t*0.37)>0.93){g.fillStyle='rgba(0,0,0,0.85)';g.fillRect(1066,376,7,22)}
  for(let i=0;i<3;i++){const cx=((t*12+i*500)%(W+600))-300,cy=130+i*40;g.fillStyle=rg(g,cx,cy,10,220,[[0,'rgba(20,24,32,0.55)'],[1,'rgba(20,24,32,0)']]);g.save();g.translate(cx,cy);g.scale(2.4,0.5);g.translate(-cx,-cy);g.fillRect(cx-220,cy-220,440,440);g.restore()}
  for(const f of FOG){f.x+=f.v*0.016;if(f.x-f.r>W)f.x=-f.r;g.fillStyle=rg(g,f.x,f.y,10,f.r,[[0,'rgba(120,130,150,0.09)'],[1,'rgba(120,130,150,0)']]);g.fillRect(f.x-f.r,f.y-f.r,f.r*2,f.r*2)}
  g.globalAlpha=0.8;g.drawImage(VIG,0,0);g.globalAlpha=0.08;g.fillStyle=g.createPattern(NOISE[(t*24|0)%3],'repeat');g.fillRect(0,0,W,H);g.globalAlpha=1;
  if(AU.ctx&&G.mode==='title'){G.tMel=(G.tMel||0)-0.016;if(G.tMel<=0){G.tMel=16;melody(LULLABY,0.6,0.04,0,true)}}
}

/* ================= 输入 ================= */
function layout(){const s=Math.min(innerWidth/W,innerHeight/H);G.scale=s;cvs.style.width=W*s+'px';cvs.style.height=H*s+'px';G.ox=(innerWidth-W*s)/2;G.oy=(innerHeight-H*s)/2;cvs.style.left=G.ox+'px';cvs.style.top=G.oy+'px'}
addEventListener('resize',layout);layout();
function toL(e){return [(e.clientX-G.ox)/G.scale,(e.clientY-G.oy)/G.scale]}
cvs.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||G.touch){const [x,y]=toL(e);G.tx=clamp(x,0,W);G.ty=clamp(y,0,H);if(G.touch&&Math.hypot(e.clientX-G.touch.x,e.clientY-G.touch.y)>14)G.touch.moved=true}});
cvs.addEventListener('pointerdown',e=>{audioInit();const [x,y]=toL(e);if(e.pointerType!=='mouse'){G.touch={x:e.clientX,y:e.clientY,moved:false};G.tx=x;G.ty=y;G.lx+=(x-G.lx)*0.6;G.ly+=(y-G.ly)*0.6}});
cvs.addEventListener('pointerup',e=>{const [x,y]=toL(e);if(e.pointerType==='mouse'){interactAt(x,y)}else{if(G.touch&&!G.touch.moved){G.lx=x;G.ly=y;interactAt(x,y)}G.touch=null}});
const holdOn=()=>{if(!S.hidden||G.breathLock)return;G.holding=true;$('bBreath').classList.add('on')};
const holdOff=()=>{G.holding=false;G.breathLock=false;$('bBreath').classList.remove('on')};
$('bBreath').addEventListener('pointerdown',e=>{e.preventDefault();holdOn()});['pointerup','pointerleave','pointercancel'].forEach(ev=>$('bBreath').addEventListener(ev,holdOff));
$('bUnhide').onclick=unhide;$('bHide').onclick=hide;
$('bLight').onclick=toggleLight;$('bInv').onclick=invOpen;$('bPause').onclick=pause;
function toggleLight(){if(G.mode!=='play'||S.hidden)return;S.light=!S.light;click();updHUD()}
addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();if(!e.repeat)holdOn();return}
  if(e.repeat)return;const k=e.key.toLowerCase();
  if(k==='escape'){if(G.modal&&!G.modalLock){closeModal();return}if(G.mode==='play')pause();else if(G.mode==='paused')resume();return}
  if(G.mode!=='play'||G.modal)return;
  if(k==='f')toggleLight();else if(k==='r')swapBattery();else if(k==='i'||k==='tab'){e.preventDefault();invOpen()}else if(k==='e'||k==='h'){S.hidden?unhide():hide()}
  else{const dir={a:'left',arrowleft:'left',d:'right',arrowright:'right',w:'up',arrowup:'up',s:'down',arrowdown:'down',x:'back'}[k];if(dir){const ex=ROOMS[S.room].exits.find(x=>x.dir===dir)||(dir==='down'?ROOMS[S.room].exits.find(x=>x.dir==='back'):null);if(ex)useExit(ex)}}
});
addEventListener('keyup',e=>{if(e.code==='Space')holdOff()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.mode==='play')pause()});

/* ================= 菜单 ================= */
const HELP=`<h2>操作说明</h2><p><b>电脑</b>：移动鼠标照亮 · 点击调查/拾取 · WASD 或方向键 / 底部按钮移动（X 返回）· F 开关手电 · R 换电池 · I 背包 · E 躲藏/出来 · 按住空格屏息 · Esc 暂停</p><p><b>手机</b>：手指拖动照亮 · 轻点调查 · 底部按钮移动 · 右下角「躲藏」· 躲藏时按住「屏息」</p><p class="dim">物品只有被手电照到才看得见。电池会耗尽；黑暗与「看见她」都会消耗理智。<br>留意声音：脚步声来自哪一侧，她就在哪个方向。心跳加快，说明她很近。<br>她进屋时若你已躲好，在她搜寻期间按住屏息——但气息有限，适时换气。<br>进入房间时会自动存档；被抓住会回到最近的检查点。</p><div class="row"><button data-close>知道了</button></div>`;
function settingsHTML(){return `<h2>设置</h2><label><input type="checkbox" id="sMild" ${SET.mild?'checked':''}> 减弱惊吓与闪烁（无全屏闪白、无鬼脸特写、无晃动）</label><label><input type="checkbox" id="sCap" ${SET.captions?'checked':''}> 声音字幕（用文字提示声音方向）</label><label>音量 <input type="range" id="sVol" min="0" max="1" step="0.05" value="${SET.vol}"></label><p class="dim">${RM?'检测到系统「减少动态效果」，已默认开启减弱模式。':''}</p><div class="row"><button data-close>完成</button></div>`}
function openSettings(back){openModal(settingsHTML());bindClose();$('sMild').onchange=e=>{SET.mild=e.target.checked;saveSet()};$('sCap').onchange=e=>{SET.captions=e.target.checked;saveSet()};$('sVol').oninput=e=>{SET.vol=+e.target.value;saveSet()};if(back)G.afterModal=back}
function pause(){if(G.mode!=='play'||G.busy)return;G.mode='paused';if(AU.ctx)AU.ctx.suspend();
  openModal(`<h2>暂停</h2><p class="dim">已自动存档。理智 ${S.sanity|0} · 电量 ${S.battery|0}% · 日记 ${S.diary.length}/5</p><div class="row" style="flex-direction:column"><button id="pRes">继续</button><button id="pSet">设置</button><button id="pHelp">操作说明</button><button id="pTitle">返回标题</button></div>`);G.modalLock=true;
  $('pRes').onclick=resume;$('pSet').onclick=()=>{G.modalLock=false;openSettings(pause2)};$('pHelp').onclick=()=>{G.modalLock=false;openModal(HELP);bindClose();G.afterModal=pause2};$('pTitle').onclick=()=>{safeSave();location.reload()}}
function pause2(){G.mode='play';pause()}
function resume(){G.modalLock=false;closeModal();G.mode='play';if(AU.ctx)AU.ctx.resume();last=performance.now()}
$('dRetry').onclick=retry;$('dTitleBtn').onclick=()=>location.reload();
if(localStorage.getItem(SAVE_KEY))$('tCont').classList.remove('hidden');
$('tSet').onclick=()=>{audioInit();openSettings()};$('tHelp').onclick=()=>{openModal(HELP);bindClose()};
$('tNew').onclick=()=>{audioInit();S=newState();CP=JSON.stringify(S);intro()};
$('tCont').onclick=()=>{audioInit();if(loadSave())startPlay(true);else{S=newState();intro()}};
function intro(){$('title').classList.add('hidden');G.mode='intro';
  openModal(`<h2>一八九九年，深秋</h2><p>你叫艾达·莫尔，伦敦一家律师事务所的遗产鉴定员。<br>艾什科姆家族的最后一位继承人去世了，你被派来清点<b>灰荆庄园</b>的遗物。</p><p>马车夫在铁门外就不肯再往前走。<br>你推门进去的那一刻，身后的大门自己合上了。锁舌「咔」地一声落下。</p><p class="dim">你习惯把怀表戴在左手腕上。表带总是勒着那一小块皮肤。</p><p class="dim">找到离开的办法。别让她找到你。</p><div class="row"><button id="iGo">点亮手电</button></div>`,'paper');G.modalLock=true;
  $('iGo').onclick=()=>{G.modalLock=false;closeModal();startPlay(false)}}
function startPlay(cont){$('title').classList.add('hidden');$('hud').classList.remove('hidden');G.mode='play';G.fade=1;G.fadeDir=-1;click();ambLevel(0.5);enterRoom(S.room,null,cont);if(!cont){setTimeout(()=>say('（移动鼠标或手指照亮四周。物品只有被照到才看得见。）',4500),2600)}else say('……你回到了灰荆庄园。',2500);CP=CP||JSON.stringify(S)}

/* ================= 主循环 ================= */
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(0.05,(now-last)/1000);last=now;if(G.mode==='play'&&!G.modal)update(dt);else if(G.mode==='play'&&G.modal){updHUD()}try{render(now/1000)}catch(err){console.error(err)}}
requestAnimationFrame(loop);

/* ================= 测试接口 ================= */
window.__manor={
  get S(){return S},G,ROOMS,
  toClient(x,y){return [G.ox+x*G.scale,G.oy+y*G.scale]},
  hot(id){const h=ROOMS[S.room].hot.find(h=>h.id===id);return h?{x:h.x,y:h.y}:null},
  light(x,y){G.tx=G.lx=x;G.ty=G.ly=y},
  step(sec){const n=Math.ceil(sec/0.05);for(let i=0;i<n&&G.mode==='play';i++)update(0.05)},
  entityOff(){S.flags.entityOn=true;S.E.room='basement';S.E.state='off'},entityOn(r){S.E.room=r||'basement';S.E.state='roam';S.E.timer=1e9},
  forceEnter(){S.flags.entityOn=true;const E=S.E;E.from=GRAPH[S.room][0];E.room=E.from;E.state='entering';E.target=S.room;E.enterT=0.01},
  mode:()=>G.mode,modal:()=>G.modal,go:(r)=>go(r),busy:()=>G.busy
};
})();
</script>
