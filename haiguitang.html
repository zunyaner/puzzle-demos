<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1410">
<title>海龟汤馆 · 情境推理</title>
<style>
:root{
  --bg:#1a1410;--bg2:#241c16;--card:#2c221c;--line:#4a3a2c;
  --gold:#c9a86c;--gold2:#e8d4a8;--text:#e8dfd2;--muted:#9a8b78;
  --yes:#6aaa78;--no:#c47a6a;--na:#8a8490;--imp:#d4a017;
  --bowl:#3d2e22;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--bg);color:var(--text);
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  -webkit-tap-highlight-color:transparent}
body{background:
  radial-gradient(ellipse at 50% -10%,#3a2a1c 0%,transparent 55%),
  radial-gradient(ellipse at 80% 100%,#1e1814 0%,transparent 40%),
  var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--gold2);
  border-radius:8px;padding:8px 14px;transition:background .15s,border-color .15s}
button:hover{border-color:var(--gold);background:#352820}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:linear-gradient(180deg,#5a4028,#3d2a18);border-color:var(--gold);color:#fff8e8}
button.ghost{background:transparent}
a{color:var(--gold)}
.screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 16px 40px}
.hidden{display:none!important}
/* title */
#title{justify-content:center;text-align:center;gap:8px}
.bowl{
  width:120px;height:70px;margin:0 auto 8px;position:relative;
  background:radial-gradient(ellipse at 50% 0%,#6a5040 0%,var(--bowl) 60%,#1a100c 100%);
  border-radius:0 0 60px 60px;border:2px solid #5a4430;
  box-shadow:0 12px 30px rgba(0,0,0,.45),inset 0 8px 16px rgba(255,200,120,.08)}
.bowl::before{
  content:"";position:absolute;left:8%;right:8%;top:-10px;height:20px;
  border-radius:50%;background:radial-gradient(ellipse at 50% 40%,#5a4030,#2a1c14);
  border:2px solid #5a4430;box-shadow:inset 0 -4px 8px rgba(0,0,0,.4)}
.bowl::after{
  content:"";position:absolute;left:22%;right:22%;top:8px;height:14px;
  border-radius:50%;background:radial-gradient(ellipse at 50% 30%,rgba(201,168,108,.35),transparent 70%);
  animation:steam 3s ease-in-out infinite}
@keyframes steam{0%,100%{opacity:.35;transform:translateY(0)}50%{opacity:.7;transform:translateY(-4px)}}
#title h1{font-size:clamp(28px,6vw,40px);font-weight:600;letter-spacing:.2em;color:var(--gold2);
  text-shadow:0 2px 12px rgba(0,0,0,.6);margin-left:.2em}
#title .sub{color:var(--muted);font-size:13px;letter-spacing:.15em;margin-bottom:18px}
#title .menu{display:flex;flex-direction:column;gap:10px;width:min(280px,90vw);margin-top:8px}
#title .menu button{padding:12px}
.stats{color:var(--muted);font-size:12px;margin-top:16px}
/* list */
#list{width:min(720px,100%)}
#list header{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
#list header h2{flex:1;font-weight:600;font-size:20px;letter-spacing:.12em;color:var(--gold2)}
.prog{font-size:12px;color:var(--muted)}
.grid{display:grid;gap:10px}
.card{
  background:linear-gradient(160deg,#32261e,var(--card));border:1px solid var(--line);
  border-radius:12px;padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:6px;
  width:100%}
.card:hover{border-color:var(--gold)}
.card .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.tag.cat{color:var(--gold);border-color:#6a5438}
.tag.diff{letter-spacing:.05em}
.tag.done{color:var(--yes);border-color:#3a6a48}
.card h3{font-size:16px;font-weight:600;color:var(--text)}
.card p{font-size:13px;color:var(--muted);line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* play */
#play{width:min(820px,100%);padding-top:12px}
#play .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
#play .top h2{flex:1;font-size:18px;color:var(--gold2);font-weight:600}
.situation{
  background:linear-gradient(180deg,#2a2018,#221a14);border:1px solid var(--line);
  border-left:3px solid var(--gold);border-radius:10px;padding:16px 18px;line-height:1.75;
  font-size:15px;margin-bottom:12px;box-shadow:inset 0 1px 0 rgba(255,220,160,.05)}
.situation .label{font-size:11px;color:var(--gold);letter-spacing:.2em;margin-bottom:6px}
.history{
  background:var(--bg2);border:1px solid var(--line);border-radius:10px;
  max-height:min(38vh,340px);overflow-y:auto;padding:8px;margin-bottom:10px}
.history:empty::after{content:"还没有提问。试着问一个可以用「是 / 不是」回答的问题。";display:block;color:var(--muted);font-size:13px;padding:12px;text-align:center}
.h-item{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;padding:8px 10px;border-bottom:1px solid rgba(74,58,44,.5);font-size:13px;align-items:start}
.h-item:last-child{border-bottom:none}
.badge{font-size:11px;padding:2px 8px;border-radius:99px;font-weight:600;white-space:nowrap;margin-top:2px}
.badge.是{background:rgba(106,170,120,.2);color:var(--yes);border:1px solid rgba(106,170,120,.35)}
.badge.不是{background:rgba(196,122,106,.2);color:var(--no);border:1px solid rgba(196,122,106,.35)}
.badge.无关{background:rgba(138,132,144,.15);color:var(--na);border:1px solid rgba(138,132,144,.3)}
.badge.重要{background:rgba(212,160,23,.18);color:var(--imp);border:1px solid rgba(212,160,23,.4)}
.ask{display:flex;gap:8px;margin-bottom:8px}
.ask input{
  flex:1;background:#1a1410;border:1px solid var(--line);border-radius:8px;
  padding:10px 12px;color:var(--text);outline:none}
.ask input:focus{border-color:var(--gold)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.hint-box{font-size:13px;color:var(--muted);padding:8px 12px;border-radius:8px;background:rgba(201,168,108,.06);border:1px dashed var(--line);margin-bottom:8px;line-height:1.6;display:none}
.hint-box.show{display:block}
.mode-pill{font-size:11px;color:var(--muted)}
.mode-pill.ai{color:#7ec8e3}
/* modal */
#modal{
  position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;
  padding:16px;z-index:50}
#modal .panel{
  background:linear-gradient(#2a2018,#1c1612);border:1px solid var(--line);border-radius:12px;
  width:min(520px,100%);max-height:88vh;overflow:auto;padding:20px 22px;box-shadow:0 16px 50px rgba(0,0,0,.5)}
#modal h3{font-size:17px;color:var(--gold2);margin-bottom:10px;font-weight:600}
#modal p,#modal li{font-size:14px;line-height:1.7;color:var(--text);margin-bottom:8px}
#modal label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
#modal input,#modal textarea,#modal select{
  width:100%;background:#140f0c;border:1px solid var(--line);border-radius:6px;
  padding:8px 10px;color:var(--text)}
#modal textarea{min-height:110px;resize:vertical;line-height:1.55}
#modal .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.spoil{margin-top:10px}
.spoil summary{cursor:pointer;color:var(--gold);font-size:13px;user-select:none}
.spoil .ans{margin-top:8px;padding:12px;background:#140f0c;border-radius:8px;font-size:14px;line-height:1.7;color:#d8cfc0}
.miss{color:var(--no)}.got{color:var(--yes)}
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#120e0b;
  border:1px solid var(--gold);color:var(--gold2);padding:10px 16px;border-radius:8px;
  font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:60;max-width:90vw;text-align:center}
.toast.show{opacity:1}
@media(max-width:560px){
  .ask{flex-direction:column}
  .ask button{width:100%}
  .h-item{grid-template-columns:1fr;gap:4px}
}
</style>
</head>
<body>
<section id="title" class="screen">
  <div class="bowl" aria-hidden="true"></div>
  <h1>海龟汤馆</h1>
  <div class="sub">情境推理 · 只问是非</div>
  <div class="menu">
    <button class="primary" id="tPlay">进入汤馆</button>
    <button id="tHow">怎么玩</button>
    <button id="tSet">设置（含 AI 模式）</button>
  </div>
  <div class="stats" id="tStats"></div>
</section>

<section id="list" class="screen hidden">
  <header>
    <button class="ghost" id="lBack">← 标题</button>
    <h2>今日汤单</h2>
    <span class="prog" id="lProg"></span>
    <button id="lSet">设置</button>
  </header>
  <div class="grid" id="lGrid"></div>
</section>

<section id="play" class="screen hidden">
  <div class="top">
    <button class="ghost" id="pBack">← 汤单</button>
    <h2 id="pTitle"></h2>
    <span class="mode-pill" id="pMode">离线引擎</span>
  </div>
  <div class="situation"><div class="label">结　局</div><div id="pSit"></div></div>
  <div class="history" id="pHist" aria-live="polite"></div>
  <div class="hint-box" id="pHint"></div>
  <form class="ask" id="pForm">
    <input id="pQ" type="text" maxlength="120" placeholder="输入是非问句，例如：他是不是在打嗝？" autocomplete="off" enterkeyhint="send">
    <button class="primary" type="submit">提问</button>
  </form>
  <div class="actions">
    <button type="button" id="pHintBtn">提示（还剩 <span id="pHintLeft">3</span>）</button>
    <button type="button" id="pSubmit">提交推理</button>
    <button type="button" id="pGive">放弃 / 看答案</button>
  </div>
</section>

<div id="modal" class="hidden"><div class="panel" id="mpanel"></div></div>
<div class="toast" id="toast"></div>
<script>
/* ===== 原创海龟汤题库 ===== */
const PUZZLES=[
{id:'hiccup',title:'谢谢消防员',cat:'黑色幽默',diff:1,
 situation:'一个男人冲进消防站，大喊「快拉警报！」消防员拉响了警笛。男人说了声「谢谢」就平静地走了。现场没有火灾，也没有任何危险。',
 story:'男人打嗝打了很久停不下来。巨大的惊吓可以止嗝，所以他冲进消防站让人拉响警笛。警笛声吓了他一跳，打嗝立刻停了，于是道谢离开。',
 points:[
  {id:'hiccup',label:'他在打嗝',keys:['打嗝','呃逆','嗝']},
  {id:'scare',label:'用巨大声响/惊吓止嗝',keys:['惊吓','吓','止嗝','警笛','警报','吓一跳','突然']},
  {id:'nofire',label:'没有真的火灾',keys:['没有火','没着火','不是火灾','无火灾','假火','不是真']}
 ],
 rules:[
  {a:'是',any:['打嗝','呃逆','在打嗝','不停打嗝','止不住的嗝']},
  {a:'是',any:['想被吓','需要惊吓','用惊吓','吓一跳能','惊吓可以','止嗝','治打嗝','止住打嗝']},
  {a:'是',any:['警笛','警报声','巨大的声音','很大的声','噪声']},
  {a:'是',any:['道谢','谢谢是因为','因为止住了','打嗝停了','好了']},
  {a:'不是',any:['着火','火灾','真的火','房子着','燃烧','烟雾']},
  {a:'不是',any:['抢劫','杀人','犯罪','逃犯','警察抓']},
  {a:'不是',any:['精神病','疯了','恶作剧','开玩笑整人','整蛊消防员']},
  {a:'不是',any:['他是消防员','他在消防站工作']},
  {a:'无关',any:['妻子','孩子','年龄','天气','星期几','吃了什么']},
  {a:'重要',any:['身体','生理','不舒服','难受','想停下来','声音','听觉']}
 ],
 hints:['想想：什么样的生理小麻烦，可以用「突然吓一大跳」来解决？','警笛的作用不是救火，而是制造一声巨响。','他在打嗝，巨响止住了打嗝。']
},
{id:'bread',title:'递给空气的面包',cat:'温情',diff:1,
 situation:'独居老人每天中午把刚出炉的半个面包从窗口递出去——窗外空无一人。他敲三下窗框，把手伸出去停几秒，然后满意地收回空着手，自己吃掉剩下的半个。',
 story:'隔壁住着他年迈的老战友，因中风不能说话，也几乎出不了门。两人约定：每天中午老人敲三下窗框，战友把一只手从自己的窗口伸过来接面包。因为两扇窗户紧挨着，从街上/房间内侧看，就像老人在把面包递给空气。',
 points:[
  {id:'neighbor',label:'有人在隔壁接面包',keys:['邻居','隔壁','战友','老人','另一','有人接','对面']},
  {id:'window',label:'两扇窗户紧挨着',keys:['窗户','窗口','窗挨','相邻的窗','并排']},
  {id:'disabled',label:'对方行动不便/难以出门',keys:['中风','病','腿','出门','行动不便','残疾','不能出门','出不了']},
  {id:'signal',label:'敲三下是约定信号',keys:['敲','三下','约定','信号','暗号']}
 ],
 rules:[
  {a:'是',any:['邻居','隔壁','旁边的人','另一户','战友','老朋友']},
  {a:'是',any:['有人接','有人拿','手伸过来','接走','接面包']},
  {a:'是',any:['窗户挨','窗并排','两扇窗','窗靠很近','紧挨']},
  {a:'是',any:['中风','生病','腿脚','出不了门','行动不便','残疾','不能下楼']},
  {a:'是',any:['约定','暗号','信号','敲三下','商量好']},
  {a:'是',any:['帮助','照顾','友谊','战友']},
  {a:'不是',any:['喂鸟','鸽子','流浪猫','动物','狗']},
  {a:'不是',any:['幻觉','精神病','阿尔茨海默','痴呆','幻想有人']},
  {a:'不是',any:['扔下去','丢弃','浪费','祭祀','祭拜']},
  {a:'不是',any:['小偷','机关','机器人']},
  {a:'无关',any:['面包什么味道','烤箱品牌','他的年龄精确','星期']},
  {a:'重要',any:['窗外真的','有没有人','窗户位置','隔壁','信号','敲']}
 ],
 hints:['窗外「空无一人」是从某个角度看的错觉。','两扇窗户的位置很关键。','他在把面包递给隔壁出不了门的老朋友。']
},
{id:'ring',title:'扔进河里的戒指',cat:'反转',diff:2,
 situation:'新婚妻子独自来到河边，把手指上崭新的结婚戒指用力扔进河里，然后笑着回家了。丈夫在门口等她，两人相拥，感情很好。',
 story:'婚纱摄影时用的是廉价道具戒指（真戒指怕丢）。拍完外景「扔戒指许愿」的镜头后，她按剧本把道具戒指摘下扔进河里。回家后换上真正的结婚戒指，和丈夫笑成一团回看照片。',
 points:[
  {id:'fake',label:'扔的是道具/假戒指',keys:['道具','假','便宜','廉价','仿','不是真','摄影','拍照','婚纱']},
  {id:'real',label:'真戒指还在/另有真的',keys:['真的','真正','真戒指','另一','家里还有','换']},
  {id:'photo',label:'为了拍照/录像',keys:['拍','照相','摄影','视频','镜头','外景']}
 ],
 rules:[
  {a:'是',any:['道具','假戒指','便宜货','廉价','仿制品','不是真戒指','假的']},
  {a:'是',any:['拍照','摄影','婚纱照','录像','视频','镜头','外景']},
  {a:'是',any:['真戒指','真正的','另一枚','家里还有','换上真']},
  {a:'是',any:['感情好','恩爱','没有吵架','不是分手']},
  {a:'不是',any:['离婚','分手','出轨','吵架','后悔结婚','恨他']},
  {a:'不是',any:['诅咒','迷信必须扔','还债','勒索']},
  {a:'不是',any:['戒指太紧','取不下来','手肿']},
  {a:'无关',any:['河有多深','天气','她的职业精确到']},
  {a:'重要',any:['戒指是不是真','为什么笑','拍照','道具']}
 ],
 hints:['他们的感情真的很好，这一点不用怀疑。','想想婚纱摄影里常见的「道具」。','她扔的不是真正的结婚戒指。']
},
{id:'taxi',title:'拒载的司机',cat:'悬疑',diff:2,
 situation:'夜深了，出租车司机对路边招手的人摇头拒载。那人不但没生气，反而松了口气，掏出证件说「你可以走了」，然后离开了。',
 story:'那人是交通执法人员，在突击检查疲劳驾驶。司机的已连续驾驶时长已经到上限，依法必须休息，所以拒载。执法人员正是来抓「超时仍接客」的司机；这位司机遵守规定拒载，检查通过，于是放行。',
 points:[
  {id:'officer',label:'对方是执法/检查人员',keys:['交警','执法','检查','运管','稽查','警察','证件','暗访']},
  {id:'fatigue',label:'司机疲劳/时长已满',keys:['疲劳','超时','时长','开车太久','该休息','连续驾驶']},
  {id:'pass',label:'因守规矩而通过检查',keys:['合格','通过','守法','遵守','放行','可以走']}
 ],
 rules:[
  {a:'是',any:['交警','执法','检查','运管','稽查','警察','暗访','证件']},
  {a:'是',any:['疲劳','开太久','超时','驾驶时长','该休息','连续开']},
  {a:'是',any:['检查他是否','看他拒不拒','突击','抽查']},
  {a:'是',any:['合格','通过','守规矩','守法','放行']},
  {a:'不是',any:['抢劫','杀手','要打他','危险分子']},
  {a:'不是',any:['熟人','朋友','亲戚','认出他']},
  {a:'不是',any:['车坏了','没有油','计价器坏']},
  {a:'不是',any:['歧视','看外貌拒载','嫌弃']},
  {a:'无关',any:['车是什么颜色','电台在放什么歌']},
  {a:'重要',any:['那人的身份','证件','为什么松口气','疲劳','驾驶时间']}
 ],
 hints:['注意：对方掏出了「证件」。','司机拒载的理由和交通法规有关。','这是一次针对疲劳驾驶的检查。']
},
{id:'painting',title:'盯着名画的保安',cat:'悬疑',diff:3,
 situation:'博物馆夜间失窃：镇馆名画不翼而飞。值班保安坚称自己通宵都盯着那幅画，一刻也没离开，监控也显示他一直面向画的方向。可画确实没了。',
 story:'小偷没有把整幅画取走。他从画框背面把画布割下偷走，又贴上一张同尺寸的高清复制品印刷纸。保安和监控从头到尾看着的是「画框里仍有一张图」的正面——正面几乎看不出换过。天亮清点时揭开才发现是假的。',

/* ===== 离线问答引擎 ===== */
function norm(q){
  return String(q||'').trim().toLowerCase()
    .replace(/[？?！!。，,\.、；;：:\s　]+/g,'')
    .replace(/吗$/,'')
    .replace(/呢$/,'')
    .replace(/啊$/,'')
    .replace(/呀$/,'')
    .replace(/吧$/,'')
    .replace(/么$/,'')
    .replace(/了$/,'')
    .replace(/的话$/,'')
    .replace(/请问/g,'')
    .replace(/我想问/g,'')
    .replace(/那/g,'')
    .replace(/所以/g,'');
}
function stripQ(q){
  let s=norm(q);
  // 把「是不是X」「是不是在X」等变成探测 X
  s=s.replace(/^(他|她|它|这|那|有人)?(是不是|是或不是|是否|有没有|有没有可能|会不会|能不能|可不可以|难道不是|难道)/,'');
  s=s.replace(/^(是|否)/,'');
  return s;
}
function hasAny(s,arr){return arr.some(k=>s.includes(String(k).toLowerCase()))}
function scoreRule(s,rule){
  if(!rule.any||!rule.any.length)return 0;
  let hit=0,best=0;
  for(const k of rule.any){
    const kk=String(k).toLowerCase();
    if(s.includes(kk)){hit++; best=Math.max(best,kk.length)}
  }
  if(!hit)return 0;
  return best*10+hit;
}
function answerOffline(puzzle,question){
  const raw=String(question||'').trim();
  if(!raw)return {a:'无关',why:'请先输入问题'};
  const s=stripQ(raw);
  if(s.length<2)return {a:'无关',why:'问题太短'};
  // 元问题
  if(/^(答案|真相|完整故事|剧情)/.test(s))return {a:'无关',why:'请用是非问句一点点逼近，或提交你的推理。'};
  let best={score:0,a:'无关',rule:null};
  for(const rule of puzzle.rules){
    const sc=scoreRule(s,rule);
    if(sc>best.score){best={score:sc,a:rule.a,rule}}
  }
  // 否定句微调：玩家问「是不是没有火灾」→ 若规则说「不是/着火」需小心
  // 「没有X吗」类：若命中「不是」类规则的关键词且问题含否定，可能该答「是」
  const negQ=/^(没有|不是|并非|不在|不会|不能)/.test(s)||/没有|不是真的/.test(raw);
  if(best.score>0 && negQ){
    // 「没有火灾吗？」+ 规则{不是, 着火} → 实际「是（没有火灾）」
    if(best.a==='不是') return {a:'是',why:'offline-neg'};
    if(best.a==='是') return {a:'不是',why:'offline-neg'};
  }
  if(best.score>=4)return {a:best.a,why:'offline'};
  // 弱匹配：重要线索的关键词
  for(const rule of puzzle.rules){
    if(rule.a==='重要' && scoreRule(s,rule)>0)return {a:'重要',why:'offline-soft'};
  }
  return {a:'无关',why:'offline-miss'};
}
function gradeExplanation(puzzle,text){
  const t=String(text||'').toLowerCase().replace(/\s+/g,'');
  const got=[],miss=[];
  for(const pt of puzzle.points){
    const ok=pt.keys.some(k=>t.includes(String(k).toLowerCase()));
    (ok?got:miss).push(pt);
  }
  const ratio=got.length/puzzle.points.length;
  return {got,miss,ratio,pass:ratio>=0.75 || (got.length>=puzzle.points.length-1 && puzzle.points.length<=3) || (got.length===puzzle.points.length)};
}

<script>
(function(){
'use strict';
const SAVE='hgt_progress_v1', CFG='hgt_ai_cfg_v1';
const $=id=>document.getElementById(id);
const DIFF=['','入门','简单','中等','进阶','困难'];

/* ===== state ===== */
let solved=loadSolved();
let cfg=loadCfg();
let cur=null; // {puzzle, hist, hintsUsed, solved}
function loadSolved(){try{return JSON.parse(localStorage.getItem(SAVE)||'{}')}catch(e){return{}}}
function saveSolved(){try{localStorage.setItem(SAVE,JSON.stringify(solved))}catch(e){}}
function loadCfg(){try{return Object.assign({ai:false,base:'',key:'',model:'gpt-4o-mini'},JSON.parse(localStorage.getItem(CFG)||'{}'))}catch(e){return{ai:false,base:'',key:'',model:'gpt-4o-mini'}}}
function saveCfg(){try{localStorage.setItem(CFG,JSON.stringify({ai:!!cfg.ai,base:cfg.base||'',key:cfg.key||'',model:cfg.model||'gpt-4o-mini'}))}catch(e){}}

function toast(m,ms){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),ms||2600)}

/* ===== screens ===== */
function show(id){['title','list','play'].forEach(s=>$(s).classList.toggle('hidden',s!==id))}
function updStats(){
  const n=Object.keys(solved).filter(k=>solved[k]).length;
  $('tStats').textContent=`已揭开 ${n} / ${PUZZLES.length} 碗汤`;
  $('lProg').textContent=`进度 ${n}/${PUZZLES.length}`;
}
function renderList(){
  updStats();
  const g=$('lGrid');g.innerHTML='';
  PUZZLES.forEach(p=>{
    const done=!!solved[p.id];
    const b=document.createElement('button');b.className='card';
    b.innerHTML=`<div class="row"><span class="tag cat">${p.cat}</span><span class="tag diff">${'★'.repeat(p.diff)}${'☆'.repeat(Math.max(0,4-p.diff))} ${DIFF[p.diff]||''}</span>${done?'<span class="tag done">已揭开</span>':''}</div>
      <h3>${p.title}</h3><p>${p.situation}</p>`;
    b.onclick=()=>openPuzzle(p);g.appendChild(b);
  });
}

/* ===== modal ===== */
function openModal(html){$('mpanel').innerHTML=html;$('modal').classList.remove('hidden')}
function closeModal(){$('modal').classList.add('hidden');$('mpanel').innerHTML=''}
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});

function showHow(){
  openModal(`<h3>怎么玩</h3>
  <p>每道题先给你一个匪夷所思的<strong>「结局」</strong>。你的任务是通过<strong>是非问句</strong>还原完整故事。</p>
  <p>馆主只会回答：</p>
  <ul style="padding-left:1.2em;margin-bottom:10px">
    <li><span class="badge 是">是</span> — 你的猜测方向对了</li>
    <li><span class="badge 不是">不是</span> — 与真相相反</li>
    <li><span class="badge 无关">无关</span> — 与解题无关，或无法用是非判断</li>
    <li><span class="badge 重要">重要</span> — 问到了关键线索附近（加油）</li>
  </ul>
  <p>随时可「提交推理」用自己的话写出真相；系统会指出还缺哪几块，但<strong>不剧透全文</strong>。实在想不出可「放弃」并点开剧透。</p>
  <p style="color:var(--muted);font-size:12px">默认使用本地规则引擎，无需联网。也可在设置中接入 OpenAI 兼容接口（密钥仅存本机）。注意：GitHub Pages 为 https，无法直接请求 http 内网地址（混合内容限制）。</p>
  <div class="row"><button class="primary" data-x>知道了</button></div>`);
  $('mpanel').querySelector('[data-x]').onclick=closeModal;
}
function showSettings(){
  openModal(`<h3>设置</h3>
  <label><input type="checkbox" id="cAi" ${cfg.ai?'checked':''}> 启用 AI 模式（失败时自动回退离线引擎）</label>
  <label>Base URL（OpenAI 兼容，如 https://api.openai.com/v1）</label>
  <input id="cBase" value="${esc(cfg.base)}" placeholder="https://…/v1">
  <label>API Key（仅存 localStorage，不会上传到本仓库）</label>
  <input id="cKey" type="password" value="${esc(cfg.key)}" placeholder="sk-…">
  <label>模型名</label>
  <input id="cModel" value="${esc(cfg.model)}" placeholder="gpt-4o-mini">
  <p style="color:var(--muted);font-size:12px;margin-top:10px">https 页面不能调用 <code>http://192.168.x.x</code> 等明文地址。本地用 file:// 打开或自备 https 反代即可测内网模型。</p>
  <div class="row"><button class="primary" id="cSave">保存</button><button data-x>取消</button>
  <button id="cReset" class="ghost">清除进度</button></div>`);
  $('mpanel').querySelector('[data-x]').onclick=closeModal;
  $('cSave').onclick=()=>{
    cfg.ai=$('cAi').checked;cfg.base=$('cBase').value.trim();cfg.key=$('cKey').value.trim();cfg.model=$('cModel').value.trim()||'gpt-4o-mini';
    saveCfg();closeModal();toast(cfg.ai?'已启用 AI 模式':'已保存（离线引擎）');updModePill();
  };
  $('cReset').onclick=()=>{if(confirm('确定清除所有已揭开记录？')){solved={};saveSolved();updStats();renderList();toast('进度已清除')}};
}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]))}

/* ===== play ===== */
function openPuzzle(p){
  cur={puzzle:p,hist:[],hintsUsed:0,fromSolved:!!solved[p.id]};
  $('pTitle').textContent=p.title;
  $('pSit').textContent=p.situation;
  $('pHist').innerHTML='';
  $('pHint').classList.remove('show');$('pHint').textContent='';
  $('pHintLeft').textContent=3;
  $('pQ').value='';
  updModePill();
  show('play');
  setTimeout(()=>$('pQ').focus(),100);
}
function updModePill(){
  const el=$('pMode');
  if(cfg.ai&&cfg.base){el.textContent='AI 模式';el.classList.add('ai')}
  else{el.textContent='离线引擎';el.classList.remove('ai')}
}
function addHist(q,a){
  cur.hist.push({q,a});
  const d=document.createElement('div');d.className='h-item';
  d.innerHTML=`<span class="badge ${a}">${a}</span><div>${esc(q)}</div>`;
  $('pHist').appendChild(d);$('pHist').scrollTop=$('pHist').scrollHeight;
}

async function ask(q){
  q=q.trim();if(!q||!cur)return;
  let a='无关', src='offline';
  if(cfg.ai&&cfg.base){
    try{a=await askAI(cur.puzzle,q);src='ai'}
    catch(e){a=answerOffline(cur.puzzle,q).a;src='fallback';toast('AI 不可用，已回退离线引擎',2200)}
  }else{
    a=answerOffline(cur.puzzle,q).a;
  }
  if(!['是','不是','无关','重要'].includes(a))a='无关';
  addHist(q,a);
  return {a,src};
}

function aiSystem(p){
  return `你是海龟汤（情境推理）馆主。玩家只能看见结局，不知道完整故事。你必须严格只根据完整故事回答，且回复只能是下列四词之一，不要解释、不要标点、不要其它字：
是
不是
无关
重要

规则：
- 问句陈述与故事相符 → 是
- 问句陈述与故事相反 → 不是
- 与还原真相无关、无法判断、或在套答案 → 无关
- 尚未点破但非常接近关键事实 → 重要（慎用）

完整故事（绝对保密，勿复述）：
${p.story}

已知结局：
${p.situation}`;
}
async function askAI(p,q){
  let base=cfg.base.replace(/\/$/,'');
  if(!/\/v1$/.test(base)) base+='/v1';
  const url=base+'/chat/completions';
  const headers={'Content-Type':'application/json'};
  if(cfg.key)headers.Authorization='Bearer '+cfg.key;
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),20000);
  let res;
  try{
    res=await fetch(url,{method:'POST',headers,body:JSON.stringify({
      model:cfg.model||'gpt-4o-mini',temperature:0,
      messages:[{role:'system',content:aiSystem(p)},{role:'user',content:q}]
    }),signal:ctrl.signal});
  }finally{clearTimeout(timer)}
  if(!res.ok)throw new Error('HTTP '+res.status);
  const data=await res.json();
  const text=((data.choices&&data.choices[0]&&data.choices[0].message&&data.choices[0].message.content)||'').trim();
  const m=text.match(/是|不是|无关|重要/);
  if(!m)throw new Error('bad reply');
  return m[0];
}

function useHint(){
  if(!cur)return;
  if(cur.hintsUsed>=3){toast('提示已用完');return}
  const h=cur.puzzle.hints[cur.hintsUsed];
  cur.hintsUsed++;
  $('pHintLeft').textContent=String(3-cur.hintsUsed);
  const box=$('pHint');box.classList.add('show');
  box.innerHTML=`<strong>提示 ${cur.hintsUsed}/3</strong> — ${esc(h)}`;
}

function submitExplain(){
  if(!cur)return;
  openModal(`<h3>提交你的推理</h3>
  <p style="color:var(--muted);font-size:13px">用自己的话写出完整真相。不必逐字相同，关键点齐即可。</p>
  <textarea id="exT" placeholder="我认为真相是……"></textarea>
  <div class="row"><button class="primary" id="exGo">核验</button><button data-x>取消</button></div>
  <div id="exRes" style="margin-top:12px"></div>`);
  $('mpanel').querySelector('[data-x]').onclick=closeModal;
  $('exGo').onclick=()=>{
    const t=$('exT').value.trim();
    if(t.length<8){toast('写详细一点再提交');return}
    const g=gradeExplanation(cur.puzzle,t);
    const box=$('exRes');
    if(g.pass){
      markSolved(cur.puzzle.id);
      box.innerHTML=`<p class="got"><strong>汤揭开了！</strong>关键点已齐。</p>
        <p>${esc(cur.puzzle.story)}</p>
        <div class="row"><button class="primary" id="exOk">回汤单</button></div>`;
      $('exOk').onclick=()=>{closeModal();show('list');renderList()};
    }else{
      box.innerHTML=`<p>通过 ${g.got.length}/${cur.puzzle.points.length} 个关键点。</p>
        <p class="got">已覆盖：${g.got.map(x=>x.label).join('、')||'（无）'}</p>
        <p class="miss">仍缺失：${g.miss.map(x=>'「'+x.label+'」').join('、')}</p>
        <p style="color:var(--muted);font-size:12px">以上只提示缺哪类信息，不公布原文。</p>`;
    }
  };
}
function giveUp(){
  if(!cur)return;
  openModal(`<h3>放弃 · ${esc(cur.puzzle.title)}</h3>
  <p style="color:var(--muted);font-size:13px">答案默认折叠。确认想看再展开。</p>
  <details class="spoil"><summary>点击展开完整真相（剧透）</summary>
  <div class="ans">${esc(cur.puzzle.story)}</div></details>
  <div class="row"><button data-x>关闭</button><button id="gMark">标记为已看过</button></div>`);
  $('mpanel').querySelector('[data-x]').onclick=closeModal;
  $('gMark').onclick=()=>{markSolved(cur.puzzle.id);closeModal();toast('已记录');renderList()};
}
function markSolved(id){solved[id]=true;saveSolved();updStats()}

/* ===== wire ===== */
$('tPlay').onclick=()=>{show('list');renderList()};
$('tHow').onclick=showHow;$('tSet').onclick=showSettings;
$('lBack').onclick=()=>{show('title');updStats()};
$('lSet').onclick=showSettings;
$('pBack').onclick=()=>{show('list');renderList()};
$('pForm').onsubmit=async e=>{
  e.preventDefault();
  const inp=$('pQ');const q=inp.value;if(!q.trim())return;
  inp.disabled=true;e.submitter&&(e.submitter.disabled=true);
  try{await ask(q);inp.value=''}finally{inp.disabled=false;if(e.submitter)e.submitter.disabled=false;inp.focus()}
};
$('pHintBtn').onclick=useHint;
$('pSubmit').onclick=submitExplain;
$('pGive').onclick=giveUp;

updStats();

/* test API */
window.__hgt={
  PUZZLES,solved,cfg,get cur(){return cur},
  openPuzzle,ask,answerOffline,gradeExplanation,useHint,markSolved,
  show,renderList,submitExplain,giveUp,askAI,
  setCfg(c){Object.assign(cfg,c);saveCfg();updModePill()},
  reset(){solved={};saveSolved();updStats()}
};
})();
</script>
</body>
