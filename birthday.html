<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1020">
<title>一份小惊喜</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='48' font-size='48'%3E%F0%9F%8E%82%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#1a1020; --bg2:#241830; --card:#2e2038;
  --rose:#e8a0b0; --rose2:#f2c4ce; --gold:#e8d5a8; --gold2:#f5e9c8;
  --ink:#f8f0f4; --muted:#b8a0b0; --seal:#9a3048;
  --theme: #e8a0b0;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  overflow:hidden;touch-action:manipulation}
body{background:
  radial-gradient(ellipse at 50% 0%, color-mix(in srgb, var(--theme) 28%, transparent), transparent 55%),
  radial-gradient(ellipse at 80% 100%, #2a1840 0%, transparent 45%),
  var(--bg)}
button{font:inherit;color:inherit;border:none;cursor:pointer;background:transparent}
.hidden{display:none!important}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:max(16px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
  opacity:0;pointer-events:none;visibility:hidden;transition:opacity .55s ease,visibility 0s linear .55s;z-index:1}
.screen.on{opacity:1;pointer-events:auto;visibility:visible;transition:opacity .55s ease,visibility 0s;z-index:2}
.topbar{position:fixed;top:max(8px,env(safe-area-inset-top));right:12px;z-index:50;display:flex;gap:6px}
.topbar button{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);font-size:16px;backdrop-filter:blur(8px)}
.hint{font-size:13px;color:var(--muted);margin-top:18px;letter-spacing:.08em;text-align:center}
.primary{
  margin-top:22px;padding:12px 28px;border-radius:999px;font-size:15px;letter-spacing:.12em;
  background:linear-gradient(135deg,var(--theme),color-mix(in srgb,var(--theme) 60%, #f0d0a0));
  color:#2a1020;font-weight:600;box-shadow:0 8px 28px color-mix(in srgb,var(--theme) 35%, transparent);
  border:1px solid rgba(255,255,255,.2)}
.primary:active{transform:scale(.97)}
.ghost{margin-top:10px;padding:8px 16px;font-size:13px;color:var(--muted);border:1px solid rgba(255,255,255,.12);border-radius:999px}

/* Envelope */
#env .wrap{perspective:900px;width:min(320px,86vw)}
.envelope{
  position:relative;width:100%;aspect-ratio:1.35;transform-style:preserve-3d;
  transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.envelope.open{transform:translateY(-12px)}
.env-back,.env-front,.env-flap,.env-paper{
  position:absolute;inset:0;border-radius:10px}
.env-back{background:linear-gradient(160deg,#5a3048,#3a1830);box-shadow:0 20px 50px rgba(0,0,0,.45)}
.env-paper{
  inset:10% 8% auto;height:72%;background:linear-gradient(180deg,#fff8f4,#f0e4dc);
  color:#4a3038;padding:18px 16px;font-size:15px;line-height:1.7;border-radius:6px;
  box-shadow:0 4px 16px rgba(0,0,0,.2);transform:translateY(8%);
  transition:transform 1s .15s cubic-bezier(.2,.8,.2,1);z-index:2;text-align:center}
.envelope.open .env-paper{transform:translateY(-42%)}
.env-front{
  background:linear-gradient(180deg,transparent 42%, #4a2438 42%, #3a1830);
  z-index:3;pointer-events:none;
  -webkit-mask:linear-gradient(#000 0 0) top/100% 42% no-repeat, linear-gradient(#000 0 0) bottom/100% 58% no-repeat;
  mask:linear-gradient(#000 0 0) bottom/100% 58% no-repeat}
.env-front::before{
  content:"";position:absolute;left:0;right:0;bottom:0;height:58%;
  background:linear-gradient(165deg,#6a3850,#3a1830 70%);
  clip-path:polygon(0 22%,50% 0,100% 22%,100% 100%,0 100%);
  border-radius:0 0 10px 10px}
.env-flap{
  z-index:4;transform-origin:top center;transition:transform .85s cubic-bezier(.2,.8,.2,1);
  background:linear-gradient(180deg,#7a4060,#4a2438);clip-path:polygon(0 0,100% 0,50% 58%);
  box-shadow:0 6px 16px rgba(0,0,0,.25)}
.envelope.open .env-flap{transform:rotateX(188deg);z-index:1}
.seal{
  position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);z-index:5;
  width:54px;height:54px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#c05068,var(--seal) 55%,#5a1828);
  box-shadow:0 4px 14px rgba(0,0,0,.4), inset 0 2px 4px rgba(255,200,200,.25);
  display:flex;align-items:center;justify-content:center;font-size:22px;color:#f8dce4;
  transition:opacity .4s .3s, transform .4s}
.envelope.open .seal{opacity:0;transform:translate(-50%,-50%) scale(.6)}
.env-label{font-size:13px;color:var(--muted);margin-bottom:14px;letter-spacing:.2em}
.env-to{font-size:18px;color:#5a3040;font-weight:600;margin-top:6px}
.env-from{font-size:12px;color:#8a6070;margin-top:14px}

/* Cake */
#cakeStage{position:relative;width:min(340px,92vw);height:280px}
.cake-plate{
  position:absolute;left:50%;bottom:18px;transform:translateX(-50%);
  width:78%;height:18px;border-radius:50%;
  background:radial-gradient(ellipse at 50% 40%, rgba(255,255,255,.2), transparent 60%),
    linear-gradient(90deg,#4a3848,#6a5060,#4a3848);
  box-shadow:0 10px 30px rgba(0,0,0,.4)}
.cake{
  position:absolute;left:50%;bottom:28px;transform:translateX(-50%);
  width:62%;height:110px}
.layer{
  position:absolute;left:0;right:0;border-radius:8px 8px 14px 14px;
  box-shadow:inset 0 3px 0 rgba(255,255,255,.2), 0 6px 12px rgba(0,0,0,.25)}
.layer.b{bottom:0;height:48px;background:linear-gradient(180deg,#f2c8b0,#d4908a 40%,#c07878)}
.layer.t{bottom:40px;height:42px;width:78%;left:11%;background:linear-gradient(180deg,#f8e0e8,#e8a8b8 45%,#d888a0);
  border-radius:8px 8px 12px 12px}
.icing{
  position:absolute;left:-2%;right:-2%;top:-10px;height:22px;
  background:radial-gradient(circle at 10% 100%, transparent 55%, #fff6f8 56%) 0 0/20px 22px,
    radial-gradient(circle at 10% 100%, transparent 55%, #fff6f8 56%) 10px 0/20px 22px;
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.1))}
.layer.t .icing{background:
  radial-gradient(circle at 10% 100%, transparent 55%, #fff 56%) 0 0/16px 18px,
  radial-gradient(circle at 10% 100%, transparent 55%, #fff 56%) 8px 0/16px 18px;height:18px;top:-8px}
.candles{position:absolute;left:0;right:0;top:-8px;height:70px;pointer-events:none}
.candle{
  position:absolute;bottom:0;width:8px;margin-left:-4px;pointer-events:auto;cursor:pointer;
  height:36px;border-radius:2px;
  background:linear-gradient(90deg,#f0e0c0,#fff8e8 40%,#e8d0a0);
  box-shadow:inset -2px 0 0 rgba(0,0,0,.08)}
.candle::before{content:"";position:absolute;left:50%;top:-6px;width:1.5px;height:8px;background:#3a2830;transform:translateX(-50%)}
.flame{
  position:absolute;left:50%;bottom:100%;transform:translateX(-50%);
  width:12px;height:18px;margin-bottom:4px;
  background:radial-gradient(ellipse at 50% 80%, #fff6a0 0%, #ffb040 35%, #ff6040 70%, transparent 75%);
  border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
  animation:flicker .16s ease-in-out infinite alternate;
  filter:drop-shadow(0 0 6px rgba(255,160,60,.8));
  transform-origin:50% 100%}
.candle.out .flame{animation:none;opacity:0;transform:translateX(-50%) scale(0);transition:opacity .35s, transform .45s}
@keyframes flicker{from{transform:translateX(-50%) scaleX(.92) rotate(-3deg)}to{transform:translateX(-50%) scaleX(1.05) rotate(4deg)}}
#cakeTitle{font-size:clamp(22px,5.5vw,30px);font-weight:600;letter-spacing:.12em;text-align:center;
  background:linear-gradient(135deg,var(--gold2),var(--rose2));-webkit-background-clip:text;background-clip:text;color:transparent;
  margin-bottom:6px}
#cakeSub{color:var(--muted);font-size:13px;text-align:center;margin-bottom:8px}
.mic-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}

/* Fireworks canvas */
#fw{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity .4s}
#fw.on{opacity:1}
#fwMsg{position:fixed;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;
  pointer-events:none;opacity:0;transition:opacity .8s;text-align:center;padding:20px}
#fwMsg.on{opacity:1}
#fwMsg h2{font-size:clamp(28px,8vw,48px);font-weight:600;letter-spacing:.2em;
  text-shadow:0 0 40px color-mix(in srgb,var(--theme) 60%, transparent),0 4px 20px rgba(0,0,0,.5);
  background:linear-gradient(135deg,#fff,var(--rose2),var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}

/* Photos */
#photos{justify-content:flex-start;padding-top:max(48px,env(safe-area-inset-top))}
#photos h2{font-size:18px;letter-spacing:.2em;color:var(--gold2);margin:8px 0 14px;font-weight:500}
.carousel{width:min(360px,92vw);position:relative}
.track{display:flex;transition:transform .45s cubic-bezier(.2,.8,.2,1);will-change:transform}
.card{
  flex:0 0 100%;padding:0 6px}
.card-inner{
  border-radius:18px;overflow:hidden;background:var(--card);
  border:1px solid rgba(255,255,255,.1);box-shadow:0 16px 40px rgba(0,0,0,.35)}
.card-img{
  aspect-ratio:4/5;background-size:cover;background-position:center;
  position:relative}
.card-img .ph{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:42px;opacity:.55;text-shadow:0 4px 20px rgba(0,0,0,.3)}
.card-cap{padding:14px 16px 16px;font-size:14px;line-height:1.65;color:#f0e4ea}
.dots{display:flex;gap:6px;justify-content:center;margin-top:14px}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.2);transition:background .2s,transform .2s}
.dots i.on{background:var(--theme);transform:scale(1.25)}
.nav{display:flex;gap:12px;margin-top:16px}
.nav button{padding:10px 20px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);font-size:13px;color:var(--ink)}

/* Letter */
#letter{justify-content:flex-start;padding-top:max(40px,env(safe-area-inset-top));overflow-y:auto;overflow-x:hidden}
.paper{
  width:min(400px,94vw);margin:8px auto 24px;padding:28px 22px 32px;
  background:
    linear-gradient(180deg,rgba(255,252,248,.97),rgba(244,232,220,.96));
  color:#3a2a28;border-radius:4px 12px 4px 12px;
  box-shadow:0 20px 50px rgba(0,0,0,.4), inset 0 0 0 1px rgba(180,140,120,.25);
  position:relative;min-height:60vh}
.paper::before{
  content:"";position:absolute;inset:10px;border:1px solid rgba(180,140,120,.2);border-radius:2px;pointer-events:none}
.paper .dear{font-size:15px;margin-bottom:14px;color:#6a4050}
.paper .body{font-size:15px;line-height:1.95;white-space:pre-wrap;min-height:8em;letter-spacing:.02em}
.paper .sign{margin-top:28px;text-align:right;font-size:15px;color:#6a4050;line-height:1.7}
.paper .date{font-size:12px;color:#9a7880;margin-top:4px}
.sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.star,.moon{position:absolute;pointer-events:auto;cursor:pointer}
.moon{
  width:36px;height:36px;border-radius:50%;right:12%;top:12%;
  background:radial-gradient(circle at 35% 35%,#fff6d0,#e8d090 50%,#c8a860);
  box-shadow:0 0 24px rgba(255,230,160,.35)}
.moon::after{content:"";position:absolute;right:-4px;top:-2px;width:28px;height:28px;border-radius:50%;background:var(--bg);opacity:.92}
.egg{
  position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
  background:rgba(10,6,14,.72);padding:24px;opacity:0;pointer-events:none;transition:opacity .5s}
.egg.on{opacity:1;pointer-events:auto}
.egg .box{
  max-width:340px;background:linear-gradient(160deg,#2e2038,#1e1428);border:1px solid rgba(232,160,176,.35);
  border-radius:16px;padding:22px;text-align:center;line-height:1.75;font-size:14px;color:var(--rose2);
  box-shadow:0 20px 50px rgba(0,0,0,.5)}

/* Edit mode */
#edit{position:fixed;inset:0;z-index:60;background:#140e18;overflow-y:auto;padding:20px 16px 40px;display:none}
#edit.on{display:block}
#edit h1{font-size:20px;color:var(--gold2);letter-spacing:.15em;margin-bottom:6px}
#edit .note{font-size:12px;color:var(--muted);margin-bottom:16px;line-height:1.6}
#edit label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px}
#edit input,#edit textarea,#edit select{
  width:100%;padding:10px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.12);
  background:#1e1626;color:var(--ink);font:inherit}
#edit textarea{min-height:120px;resize:vertical;line-height:1.6}
#edit .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#edit .photo-ed{background:#1e1626;border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:12px;margin-top:10px}
#edit .photo-ed img{max-width:100%;max-height:120px;border-radius:8px;display:block;margin:8px 0}
#edit .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;position:sticky;bottom:8px}
@media(min-width:720px){
  #edit .inner{max-width:640px;margin:0 auto}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .flame{animation:none!important}
}
</style>
</head>
<body>
<!--
  ============================================================
  🎂 生日惊喜页 · birthday.html
  自定义方式：
    1) 改下面 CONFIG 对象后保存；或
    2) 打开 birthday.html?edit=1 ，填表、上传照片，点「生成我的生日页」下载独立文件发给对方。
  ============================================================
-->
<script>
/* === CONFIG_START === */
const CONFIG = {
  name: "小宝",
  age: 18,
  greeting: "亲爱的小宝",
  signature: "爱你的我",
  theme: "#e8a0b0",
  title: "给 {name} 的一份小惊喜",
  envelopeNote: "轻轻点开这封信",
  cakeWish: "许个愿，然后吹灭蜡烛吧",
  fireworksText: "生日快乐",
  photos: [
    { caption: "记得那一天的阳光，你笑起来的样子。", src: "" },
    { caption: "走过的路不长，但我很高兴每一步都有你。", src: "" },
    { caption: "愿新的一岁，仍有温柔与勇气。", src: "" }
  ],
  letter: "又一年了。\n\n想把一些说不出口的话，轻轻放在这里。\n谢谢你成为我生命里稳定而明亮的存在——\n像冬天里忽然亮起的一盏灯。\n\n愿你被世界温柔以待，\n也愿你永远保留自己喜欢的样子。\n\n生日快乐。",
  egg: "你发现了小秘密。\n其实每天都想对你说：有你真好。",
  showAgeCandles: true,
  maxCandles: 12
};
/* === CONFIG_END === */
</script>

<div class="sky" id="sky" aria-hidden="true"></div>
<div class="topbar">
  <button type="button" id="btnMute" title="静音" aria-label="静音">🔊</button>
</div>

<section id="env" class="screen on">
  <div class="env-label" id="envTitle"></div>
  <div class="wrap">
    <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="打开信封">
      <div class="env-back"></div>
      <div class="env-paper">
        <div style="font-size:12px;letter-spacing:.2em;color:#a08090">TO</div>
        <div class="env-to" id="envTo"></div>
        <div class="env-from" id="envFrom"></div>
      </div>
      <div class="env-front"></div>
      <div class="env-flap"></div>
      <div class="seal">♡</div>
    </div>
  </div>
  <p class="hint" id="envHint"></p>
</section>

<section id="cake" class="screen">
  <div id="cakeTitle"></div>
  <div id="cakeSub"></div>
  <div id="cakeStage">
    <div class="cake">
      <div class="layer b"><div class="icing"></div></div>
      <div class="layer t"><div class="icing"></div><div class="candles" id="candles"></div></div>
    </div>
    <div class="cake-plate"></div>
  </div>
  <p class="hint" id="cakeHint">点亮的蜡烛 · 点一下吹灭</p>
  <div class="mic-row">
    <button type="button" class="ghost" id="btnMic">🎤 用麦克风吹蜡烛</button>
  </div>
</section>

<canvas id="fw" width="390" height="844"></canvas>
<div id="fwMsg"><h2 id="fwText"></h2></div>

<section id="photos" class="screen">
  <h2>一些小片段</h2>
  <div class="carousel" id="carousel">
    <div class="track" id="track"></div>
  </div>
  <div class="dots" id="dots"></div>
  <div class="nav">
    <button type="button" id="prevPhoto">上一张</button>
    <button type="button" class="primary" id="nextPhoto" style="margin-top:0">下一张</button>
  </div>
</section>

<section id="letter" class="screen">
  <div class="paper">
    <div class="dear" id="dear"></div>
    <div class="body" id="letterBody"></div>
    <div class="sign">
      <div id="signName"></div>
      <div class="date" id="signDate"></div>
    </div>
  </div>
  <button type="button" class="primary" id="btnReplay">再看一遍</button>
  <button type="button" class="ghost" id="btnEggHint" style="opacity:.35">✦</button>
</section>

<div class="egg" id="egg"><div class="box" id="eggBox"></div></div>

<section id="edit">
  <div class="inner">
    <h1>编辑生日惊喜</h1>
    <p class="note">填写后点击「生成我的生日页」，会下载一个可直接发送的独立 HTML（照片会压缩并嵌进文件）。密钥与数据只在你本机处理。</p>
    <div class="row2">
      <div><label>名字</label><input id="eName" /></div>
      <div><label>年龄（蜡烛数，最多 12）</label><input id="eAge" type="number" min="1" max="99" /></div>
    </div>
    <label>称呼（信开头）</label><input id="eGreet" />
    <label>署名</label><input id="eSign" />
    <label>主题色</label><input id="eTheme" type="color" />
    <label>信封标题（可用 {name}）</label><input id="eTitle" />
    <label>蛋糕旁祝福短句</label><input id="eWish" />
    <label>烟花大字</label><input id="eFw" />
    <label>信件正文</label><textarea id="eLetter"></textarea>
    <label>彩蛋留言（点月亮/星星 3 次）</label><textarea id="eEgg" style="min-height:70px"></textarea>
    <label>回忆照片（最多 6 张）</label>
    <div id="ePhotos"></div>
    <button type="button" class="ghost" id="eAddPhoto" style="margin-top:8px">＋ 添加一张</button>
    <div class="actions">
      <button type="button" class="primary" id="eGen" style="margin-top:0">生成我的生日页</button>
      <button type="button" class="ghost" id="ePreview" style="margin-top:0">预览效果</button>
      <button type="button" class="ghost" id="eClose" style="margin-top:0">关闭编辑</button>
    </div>
  </div>
</section>

<script>
(function(){
'use strict';
const RM = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const $ = id => document.getElementById(id);
const C = () => CONFIG;

function applyTheme(){
  document.documentElement.style.setProperty('--theme', C().theme || '#e8a0b0');
  document.title = (C().title || '惊喜').replace('{name}', C().name);
}

/* ---------- audio ---------- */
const AU = {ctx:null, muted:false, master:null};
function audioInit(){
  if(AU.ctx){ if(AU.ctx.state==='suspended') AU.ctx.resume(); return AU.ctx; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return null;
  AU.ctx = new AC();
  AU.master = AU.ctx.createGain();
  AU.master.gain.value = AU.muted ? 0 : 0.45;
  AU.master.connect(AU.ctx.destination);
  // soft pad
  const pad = AU.ctx.createOscillator(); pad.type='sine'; pad.frequency.value=110;
  const pg = AU.ctx.createGain(); pg.gain.value=0.04;
  pad.connect(pg); pg.connect(AU.master); pad.start();
  const pad2 = AU.ctx.createOscillator(); pad2.type='sine'; pad2.frequency.value=164.8;
  const pg2 = AU.ctx.createGain(); pg2.gain.value=0.025;
  pad2.connect(pg2); pg2.connect(AU.master); pad2.start();
  return AU.ctx;
}
function setMute(m){
  AU.muted=m; $('btnMute').textContent = m ? '🔇' : '🔊';
  if(AU.master) AU.master.gain.setTargetAtTime(m?0:0.45, AU.ctx.currentTime, 0.05);
}
$('btnMute').onclick = ()=>{ audioInit(); setMute(!AU.muted); };

const NOTES = {
  C4:261.63,D4:293.66,E4:329.63,F4:349.23,G4:392.00,A4:440.00,B4:493.88,
  C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99
};
// Happy Birthday (simplified)
const MELODY = [
  ['G4',.35],['G4',.15],['A4',.5],['G4',.5],['C5',.5],['B4',1],
  ['G4',.35],['G4',.15],['A4',.5],['G4',.5],['D5',.5],['C5',1],
  ['G4',.35],['G4',.15],['G5',.5],['E5',.5],['C5',.5],['B4',.5],['A4',1],
  ['F5',.35],['F5',.15],['E5',.5],['C5',.5],['D5',.5],['C5',1.2]
];
function playNote(freq, t, dur, vol){
  if(!AU.ctx||AU.muted) return;
  const o = AU.ctx.createOscillator(); o.type='triangle'; o.frequency.value=freq;
  const o2 = AU.ctx.createOscillator(); o2.type='sine'; o2.frequency.value=freq*2;
  const g = AU.ctx.createGain();
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vol, t+0.03);
  g.gain.exponentialRampToValueAtTime(0.001, t+dur);
  const g2 = AU.ctx.createGain(); g2.gain.value=0.15;
  o.connect(g); o2.connect(g2); g2.connect(g); g.connect(AU.master);
  o.start(t); o2.start(t); o.stop(t+dur+0.05); o2.stop(t+dur+0.05);
}
function playMelody(){
  const c = audioInit(); if(!c) return;
  let t = c.currentTime + 0.08;
  MELODY.forEach(([n,d])=>{
    playNote(NOTES[n], t, d*0.85, 0.18);
    t += d * (RM ? 0.55 : 0.72);
  });
}
function whoosh(){
  const c=audioInit(); if(!c||AU.muted) return;
  const t=c.currentTime;
  const buf=c.createBuffer(1, c.sampleRate*0.4, c.sampleRate);
  const d=buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
  const s=c.createBufferSource(); s.buffer=buf;
  const f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.setValueAtTime(800,t); f.frequency.exponentialRampToValueAtTime(200,t+0.35);
  const g=c.createGain(); g.gain.setValueAtTime(0.2,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.35);
  s.connect(f); f.connect(g); g.connect(AU.master); s.start(t);
}
function softPop(){
  const c=audioInit(); if(!c||AU.muted) return;
  const t=c.currentTime;
  const o=c.createOscillator(); o.frequency.setValueAtTime(600,t); o.frequency.exponentialRampToValueAtTime(120,t+0.15);
  const g=c.createGain(); g.gain.setValueAtTime(0.12,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.15);
  o.connect(g); g.connect(AU.master); o.start(t); o.stop(t+0.16);
}

/* ---------- stars ---------- */
function buildSky(){
  const sky=$('sky'); sky.innerHTML='';
  const moon=document.createElement('div'); moon.className='moon'; moon.title='…'; sky.appendChild(moon);
  for(let i=0;i<28;i++){
    const s=document.createElement('div'); s.className='star';
    const x=Math.random()*100, y=Math.random()*55, sz=1+Math.random()*2.2;
    s.style.cssText=`left:${x}%;top:${y}%;width:${sz}px;height:${sz}px;border-radius:50%;background:rgba(255,240,250,${0.35+Math.random()*0.5});box-shadow:0 0 ${4+sz*2}px rgba(255,230,250,.4)`;
    sky.appendChild(s);
  }
  let taps=0;
  const onEgg = ()=>{
    taps++;
    if(taps>=3){ taps=0; showEgg(); }
  };
  moon.addEventListener('click', onEgg);
  sky.querySelectorAll('.star').forEach((s,i)=>{ if(i%7===0) s.addEventListener('click', onEgg); });
}
function showEgg(){
  $('eggBox').textContent = C().egg || '♡';
  $('egg').classList.add('on');
  softPop();
}
$('egg').onclick = e=>{ if(e.target.id==='egg') $('egg').classList.remove('on'); };
$('btnEggHint').onclick = ()=>{ tapsForceEgg(); };
function tapsForceEgg(){ showEgg(); }

/* ---------- screens ---------- */
function show(id){
  ['env','cake','photos','letter'].forEach(s => $(s).classList.toggle('on', s===id));
}

/* ---------- envelope ---------- */
function setupEnvelope(){
  applyTheme();
  $('envTitle').textContent = (C().title||'').replace('{name}', C().name);
  $('envTo').textContent = C().name;
  $('envFrom').textContent = '— ' + C().signature;
  $('envHint').textContent = C().envelopeNote || '点按信封打开';
  const open = ()=>{
    audioInit();
    $('envelope').classList.add('open');
    softPop();
    setTimeout(()=>{ show('cake'); setupCake(); }, RM ? 400 : 1000);
  };
  $('envelope').onclick = open;
  $('envelope').onkeydown = e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); open(); } };
}

/* ---------- cake / candles ---------- */
let litCount=0, totalCandles=0, micStream=null, micRAF=0;
function setupCake(){
  $('cakeTitle').textContent = C().name + '，生日快乐';
  $('cakeSub').textContent = C().cakeWish || '';
  const box=$('candles'); box.innerHTML='';
  let n = C().showAgeCandles === false ? 5 : (C().age|0);
  n = Math.max(1, Math.min(C().maxCandles||12, n));
  totalCandles=n; litCount=n;
  for(let i=0;i<n;i++){
    const el=document.createElement('div'); el.className='candle';
    const pct = n===1 ? 50 : (12 + i*(76/(n-1)));
    el.style.left = pct + '%';
    el.innerHTML='<div class="flame"></div>';
    el.onclick = ev=>{ ev.stopPropagation(); blowOne(el); };
    box.appendChild(el);
  }
}
function blowOne(el){
  if(el.classList.contains('out')) return;
  el.classList.add('out'); litCount--; whoosh();
  if(litCount<=0) onAllOut();
}
function blowAll(){
  document.querySelectorAll('.candle:not(.out)').forEach((el,i)=> setTimeout(()=>blowOne(el), i*(RM?40:90)));
}
function onAllOut(){
  stopMic();
  setTimeout(startFireworks, RM?200:500);
}
async function enableMic(){
  try{
    audioInit();
    micStream = await navigator.mediaDevices.getUserMedia({audio:true, video:false});
    $('btnMic').textContent = '吹气中… 再点可取消';
    $('btnMic').onclick = disableMic;
    listenMic();
  }catch(e){
    $('cakeHint').textContent = '无法使用麦克风，请直接点蜡烛～';
  }
}
function disableMic(){
  stopMic();
  $('btnMic').textContent='🎤 用麦克风吹蜡烛';
  $('btnMic').onclick = enableMic;
}
$('btnMic').onclick = enableMic;
function stopMic(){
  if(micRAF) cancelAnimationFrame(micRAF); micRAF=0;
  if(micStream){ micStream.getTracks().forEach(t=>t.stop()); micStream=null; }
}
function listenMic(){
  const c=audioInit(); if(!c||!micStream) return;
  const src=c.createMediaStreamSource(micStream);
  const an=c.createAnalyser(); an.fftSize=256; src.connect(an);
  const data=new Uint8Array(an.frequencyBinCount);
  let cool=0;
  const tick=()=>{
    an.getByteFrequencyData(data);
    let sum=0; for(let i=2;i<40;i++) sum+=data[i];
    const avg=sum/38;
    if(cool>0) cool--;
    if(avg>42 && cool===0 && litCount>0){
      const next=document.querySelector('.candle:not(.out)');
      if(next){ blowOne(next); cool=12; }
    }
    micRAF=requestAnimationFrame(tick);
  };
  tick();
}

/* ---------- fireworks ---------- */
const fw=$('fw'); const fctx=fw.getContext('2d');
let particles=[], bursts=[], fwAnim=0;
function resizeFw(){
  fw.width=window.innerWidth*devicePixelRatio;
  fw.height=window.innerHeight*devicePixelRatio;
  fw.style.width=window.innerWidth+'px'; fw.style.height=window.innerHeight+'px';
  fctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}
addEventListener('resize', resizeFw);
function spawnBurst(x,y,color){
  const n = RM ? 24 : 55;
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, sp=1.5+Math.random()*4.5;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp, life:1, color, g:0.04+Math.random()*0.03, size:1.5+Math.random()*2.5});
  }
  // confetti
  for(let i=0;i<(RM?10:22);i++){
    particles.push({x,y,vx:(Math.random()-0.5)*6,vy:-2-Math.random()*5, life:1, color, g:0.08, size:2+Math.random()*3, conf:true, rot:Math.random()*6, rv:(Math.random()-0.5)*0.3});
  }
}
function startFireworks(){
  resizeFw(); fw.classList.add('on');
  $('fwText').textContent = C().fireworksText || '生日快乐';
  $('fwMsg').classList.add('on');
  playMelody();
  const colors=[C().theme,'#f2c4ce','#e8d5a8','#a0c8e8','#f0a0c0','#fff'];
  let n=0;
  const boom=()=>{
    if(n++>8) return;
    spawnBurst(window.innerWidth*(0.2+Math.random()*0.6), window.innerHeight*(0.2+Math.random()*0.35), colors[n%colors.length]);
    softPop();
    setTimeout(boom, RM?350:450);
  };
  boom();
  const loop=()=>{
    fctx.clearRect(0,0,window.innerWidth,window.innerHeight);
    particles = particles.filter(p=>p.life>0.02);
    for(const p of particles){
      p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; p.life*=0.965; p.vx*=0.99;
      fctx.globalAlpha=Math.max(0,p.life);
      fctx.fillStyle=p.color;
      if(p.conf){ p.rot+=p.rv; fctx.save(); fctx.translate(p.x,p.y); fctx.rotate(p.rot); fctx.fillRect(-p.size, -p.size/2, p.size*2, p.size); fctx.restore(); }
      else { fctx.beginPath(); fctx.arc(p.x,p.y,p.size*p.life,0,7); fctx.fill(); }
    }
    fctx.globalAlpha=1;
    fwAnim=requestAnimationFrame(loop);
  };
  loop();
  setTimeout(()=>{
    $('fwMsg').classList.remove('on');
    setTimeout(()=>{
      fw.classList.remove('on');
      cancelAnimationFrame(fwAnim);
      setupPhotos();
      show('photos');
    }, RM?300:800);
  }, RM?2800:5200);
}

/* ---------- photos ---------- */
let photoIdx=0;
function setupPhotos(){
  const track=$('track'), dots=$('dots');
  track.innerHTML=''; dots.innerHTML='';
  const grads=[
    'linear-gradient(145deg,#6a4058,#3a2848 50%,#2a4060)',
    'linear-gradient(145deg,#5a5040,#8a6058 40%,#3a3858)',
    'linear-gradient(145deg,#405060,#6a4070 55%,#503040)',
    'linear-gradient(145deg,#706050,#4a3858)',
    'linear-gradient(145deg,#584060,#305060)',
    'linear-gradient(145deg,#605040,#403858)'
  ];
  (C().photos||[]).forEach((p,i)=>{
    const card=document.createElement('div'); card.className='card';
    const imgStyle = p.src ? `background-image:url('${p.src.replace(/'/g,"\\'")}');` : `background-image:${grads[i%grads.length]};`;
    card.innerHTML=`<div class="card-inner"><div class="card-img" style="${imgStyle}">${p.src?'':`<div class="ph">${['🌸','🌙','✨','🎀','☕','🌿'][i%6]}</div>`}</div><div class="card-cap">${esc(p.caption||'')}</div></div>`;
    track.appendChild(card);
    const d=document.createElement('i'); if(i===0) d.className='on'; dots.appendChild(d);
  });
  photoIdx=0; updatePhoto();
  // swipe
  let sx=0,dx=0;
  const car=$('carousel');
  car.ontouchstart=e=>{ sx=e.touches[0].clientX; dx=0; };
  car.ontouchmove=e=>{ dx=e.touches[0].clientX-sx; };
  car.ontouchend=()=>{ if(dx<-40) nextP(); else if(dx>40) prevP(); };
}
function esc(s){ return String(s||'').replace(/[&<>"']/g,c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
function updatePhoto(){
  const n=(C().photos||[]).length || 1;
  $('track').style.transform = `translateX(-${photoIdx*100}%)`;
  [...$('dots').children].forEach((d,i)=> d.classList.toggle('on', i===photoIdx));
  $('nextPhoto').textContent = photoIdx >= n-1 ? '读一封信' : '下一张';
}
function nextP(){
  const n=(C().photos||[]).length || 1;
  if(photoIdx >= n-1){ startLetter(); return; }
  photoIdx++; updatePhoto();
}
function prevP(){ if(photoIdx>0){ photoIdx--; updatePhoto(); } }
$('nextPhoto').onclick=nextP; $('prevPhoto').onclick=prevP;

/* ---------- letter ---------- */
let typeTimer=0;
function startLetter(){
  show('letter');
  $('dear').textContent = (C().greeting || ('亲爱的' + C().name)) + '：';
  $('signName').textContent = C().signature || '';
  const now=new Date();
  $('signDate').textContent = now.getFullYear() + '.' + (now.getMonth()+1) + '.' + now.getDate();
  const body=$('letterBody'); body.textContent='';
  const text=C().letter||'';
  let i=0; clearInterval(typeTimer);
  if(RM){ body.textContent=text; return; }
  typeTimer=setInterval(()=>{
    body.textContent = text.slice(0, ++i);
    if(i>=text.length) clearInterval(typeTimer);
    const paper=body.parentElement; paper.parentElement.scrollTop = paper.parentElement.scrollHeight;
  }, 42);
}
$('btnReplay').onclick = ()=>{
  stopMic();
  $('envelope').classList.remove('open');
  fw.classList.remove('on'); $('fwMsg').classList.remove('on');
  show('env'); setupEnvelope();
};

/* ---------- edit mode ---------- */
function isEdit(){ return /(?:\?|&)edit=1(?:&|$)/.test(location.search) || location.hash==='#edit'; }

function fillEditor(){
  $('eName').value=C().name; $('eAge').value=C().age;
  $('eGreet').value=C().greeting; $('eSign').value=C().signature;
  $('eTheme').value = /^#/.test(C().theme)?C().theme:'#e8a0b0';
  $('eTitle').value=C().title; $('eWish').value=C().cakeWish;
  $('eFw').value=C().fireworksText; $('eLetter').value=C().letter; $('eEgg').value=C().egg;
  renderPhotoEditors(C().photos||[]);
}
function renderPhotoEditors(photos){
  const box=$('ePhotos'); box.innerHTML='';
  photos.forEach((p,i)=> box.appendChild(photoEdRow(p,i)));
}
function photoEdRow(p,i){
  const div=document.createElement('div'); div.className='photo-ed'; div.dataset.i=i;
  div.innerHTML=`<div style="font-size:12px;color:var(--muted)">照片 ${i+1}</div>
    <label style="margin-top:6px">说明文字</label>
    <input class="cap" value="${esc(p.caption||'')}" />
    <label>图片（可选）</label>
    <input type="file" accept="image/*" class="file" />
    ${p.src?`<img src="${p.src}" alt="">`:''}
    <button type="button" class="ghost rm" style="margin-top:6px">移除</button>`;
  const file=div.querySelector('.file');
  file.onchange = async ()=>{
    const f=file.files&&file.files[0]; if(!f) return;
    const data=await resizeImage(f, 900, 0.72);
    let img=div.querySelector('img');
    if(!img){ img=document.createElement('img'); div.insertBefore(img, div.querySelector('.rm')); }
    img.src=data; div.dataset.src=data;
  };
  if(p.src) div.dataset.src=p.src;
  div.querySelector('.rm').onclick = ()=> div.remove();
  return div;
}
$('eAddPhoto').onclick = ()=>{
  if($('ePhotos').children.length>=6) return alert('最多 6 张');
  $('ePhotos').appendChild(photoEdRow({caption:'',src:''}, $('ePhotos').children.length));
};
function readEditorConfig(){
  const photos=[...$('ePhotos').children].map(row=>({
    caption: row.querySelector('.cap').value.trim(),
    src: row.dataset.src || (row.querySelector('img')&&row.querySelector('img').src) || ''
  }));
  return {
    name: $('eName').value.trim()||'小宝',
    age: Math.max(1, Math.min(99, parseInt($('eAge').value,10)||18)),
    greeting: $('eGreet').value.trim()||'亲爱的',
    signature: $('eSign').value.trim()||'爱你的我',
    theme: $('eTheme').value||'#e8a0b0',
    title: $('eTitle').value.trim()||'给 {name} 的一份小惊喜',
    envelopeNote: C().envelopeNote,
    cakeWish: $('eWish').value.trim(),
    fireworksText: $('eFw').value.trim()||'生日快乐',
    photos: photos.length?photos:C().photos,
    letter: $('eLetter').value,
    egg: $('eEgg').value,
    showAgeCandles: true,
    maxCandles: 12
  };
}
function resizeImage(file, maxW, quality){
  return new Promise((resolve,reject)=>{
    const fr=new FileReader();
    fr.onerror=reject;
    fr.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width, h=img.height;
        if(w>maxW){ h=h*(maxW/w); w=maxW; }
        const c=document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        resolve(c.toDataURL('image/jpeg', quality));
      };
      img.onerror=reject; img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
async function generateFile(){
  const conf = readEditorConfig();
  const confJS = 'const CONFIG = ' + JSON.stringify(conf, null, 2) + ';';
  let html = window.__BDAY_SOURCE;
  try{
    const res = await fetch(location.href.split('?')[0].split('#')[0], {cache:'no-store'});
    const txt = await res.text();
    if(txt && txt.length > 1000) html = txt;
  }catch(e){}
  if(!html || html.length < 1000){
    alert('无法读取页面模板。请通过 http 打开本页（例如 GitHub Pages），或刷新后再试。');
    return;
  }
  // strip edit query artifacts not needed
  const replaced = html.replace(
    /\/\* === CONFIG_START === \*\/[\s\S]*?\/\* === CONFIG_END === \*\//,
    '/* === CONFIG_START === */\n' + confJS + '\n/* === CONFIG_END === */'
  );
  const blob = new Blob([replaced], {type:'text/html;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download = 'birthday-' + conf.name + '.html';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
$('eGen').onclick = ()=> generateFile();
$('ePreview').onclick = ()=>{
  Object.assign(CONFIG, readEditorConfig());
  applyTheme();
  $('edit').classList.remove('on');
  $('envelope').classList.remove('open');
  show('env'); setupEnvelope(); buildSky();
};
$('eClose').onclick = ()=>{
  if(isEdit()) location.search = '';
  else $('edit').classList.remove('on');
};

/* ---------- boot ---------- */
window.__BDAY_SOURCE = null; // filled only when fetched
applyTheme();
buildSky();
setupEnvelope();

function prefetchSource(){
  const url = location.href.split('?')[0].split('#')[0];
  fetch(url, {cache:'no-store'}).then(r=>r.text()).then(t=>{ if(t&&t.length>1000) window.__BDAY_SOURCE=t; }).catch(()=>{});
}
prefetchSource();
if(isEdit()){
  $('edit').classList.add('on');
  fillEditor();
}

window.__bday = {
  CONFIG, show, setupCake, blowAll, blowOne, startFireworks, startLetter, setupPhotos,
  readEditorConfig, generateFile, applyTheme, audioInit, playMelody,
  get lit(){return litCount}, get total(){return totalCandles},
  openEdit(){ $('edit').classList.add('on'); fillEditor(); }
};
})();
</script>
